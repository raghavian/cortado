name: Publish café data

on:
  schedule:
    # After Geofabrik publishes its nightly extract (usually by ~02:00 UTC). The second run is a
    # safety net: it stops within seconds when the first one already published this extract.
    # (GitHub often starts scheduled runs hours late.)
    - cron: "17 3 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # normally ~3 min; up to ~25 min while retrying Geofabrik
    outputs:
      skip: ${{ steps.snapshot.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium-tool
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=3 || true
            sudo apt-get install -y -q -o Acquire::Retries=3 osmium-tool && break
            sleep 30
          done
          if ! command -v osmium >/dev/null; then
            echo "::warning::apt could not install osmium-tool; trying conda-forge"
            "$CONDA/bin/conda" create -y -q -p "$RUNNER_TEMP/osm" -c conda-forge osmium-tool \
              && echo "$RUNNER_TEMP/osm/bin" >> "$GITHUB_PATH" \
              || { echo "::error::Could not install osmium-tool (apt and conda-forge both failed). Nothing was published; the app keeps the previous data."; exit 1; }
          fi
      - name: Build snapshot from OpenStreetMap (Geofabrik extract)
        id: snapshot
        # Scheduled runs skip the work if this extract is already published; pushes and manual runs always build.
        run: python3 scripts/build_snapshot.py --out site ${{ github.event_name == 'schedule' && '--skip-if-current' || '' }}
      - uses: actions/upload-pages-artifact@v5
        if: steps.snapshot.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
