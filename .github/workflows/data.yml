name: Publish café data

on:
  schedule:
    # Daily, after Geofabrik publishes its nightly extract (usually by ~02:00 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # only reached if it has to fall back to Overpass and retry
    steps:
      - uses: actions/checkout@v7
      # Never fails the job: without osmium the script falls back to Overpass.
      - name: Install osmium-tool
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=3 || true
            sudo apt-get install -y -q -o Acquire::Retries=3 osmium-tool && break
            sleep 30
          done
          if ! command -v osmium >/dev/null; then
            echo "::warning::apt could not install osmium-tool; trying conda-forge"
            "$CONDA/bin/conda" create -y -q -p "$RUNNER_TEMP/osm" -c conda-forge osmium-tool \
              && echo "$RUNNER_TEMP/osm/bin" >> "$GITHUB_PATH" \
              || echo "::warning::osmium-tool unavailable; the snapshot will use Overpass this time"
          fi
      - name: Build snapshot from OpenStreetMap (Geofabrik extract)
        run: python3 scripts/build_snapshot.py --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
