name: Publish café data

on:
  schedule:
    # Twice a day: if Overpass is down for one run, the next one catches up within ~12 hours.
    - cron: "17 3 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Overpass retries can take a while
    steps:
      - uses: actions/checkout@v7
      - name: Build snapshot from OpenStreetMap
        run: python3 scripts/build_snapshot.py --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
