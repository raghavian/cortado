name: Publish café data

on:
  schedule:
    # Daily, after Geofabrik publishes its nightly extract (usually by ~02:00 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # only reached if it has to fall back to Overpass and retry
    steps:
      - uses: actions/checkout@v7
      - name: Install osmium-tool
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Build snapshot from OpenStreetMap (Geofabrik extract)
        run: python3 scripts/build_snapshot.py --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
